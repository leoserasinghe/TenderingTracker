<script>
/* ====================== CONFIG — edit these for your sheet ====================== */
const SHEET_ID = "1zTyfDGcHhU4A0D4M7wrZUGUfjziuBJV3iFNJLYAU3eg";
const DASHBOARD_GID = "1798885989"; // the "Dashboard" tab
const RANGES = {
qsSummary: "B5:M12", // SUMMARY BY QS table
pipeline: "B15:D22", // PIPELINE - ALL QS COMBINED table
divisions: "F15:I22", // DIVISION SUMMARY - BUSINESS OBTAINING table
executive: "K15:N21", // EXECUTIVE TARGET SUMMARY table
};
const REFRESH_MS = 5 * 60 * 1000; // auto-refresh every 5 minutes
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* =================================================================================== */

let charts = {};
let lastData = null;
let firstLoad = true;

function gvizUrl(range){
return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${DASHBOARD_GID}&range=${range}&tqx=out:json`;
}

async function fetchRange(range){
const res = await fetch(gvizUrl(range));
const text = await res.text();
const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
if (json.status === 'error') throw new Error(json.errors?.[0]?.detailed_message || 'Sheet read error');
return json.table.rows.map(r => (r.c || []).map(c => c ? { v: c.v, f: c.f } : { v: null, f: null }));
}

function toNumber(v){
if (typeof v === 'number') return v;
if (typeof v === 'string') {
const cleaned = v.replace(/,/g, '').replace('%', '').trim();
const n = parseFloat(cleaned);
return isNaN(n) ? null : n;
}
return null;
}

function num(cell){ const n = cell ? toNumber(cell.v) : null; return n == null ? 0 : n; }
function pct(cell){ // handles fraction (0.14), already-percent numbers, or formatted strings like "61.2%"
if (!cell || cell.v == null) return 0;
const n = toNumber(cell.v);
if (n == null) return 0;
if (typeof cell.v === 'string' && cell.v.includes('%')) return n; // already a percent value
return n <= 1 ? n * 100 : n;
}
function txt(cell){ return cell && cell.v != null ? String(cell.v) : ''; }
function fmt(cell){ // prefer Google's own display string (keeps %, commas etc. intact)
if (!cell) return '';
if (cell.f != null) return cell.f;
return cell.v != null ? String(cell.v) : '';
}
function isNum(cell){ return !!cell && toNumber(cell.v) != null; }

async function loadAll(){
const btn = document.getElementById('refreshBtn');
const status = document.getElementById('status');
btn.disabled = true;
status.textContent = 'refreshing…';
try {
const [qs, pipeline, divisions, executive] = await Promise.all([
fetchRange(RANGES.qsSummary),
fetchRange(RANGES.pipeline),
fetchRange(RANGES.divisions),
fetchRange(RANGES.executive),
]);

// ---- QS summary columns (B:M), 0-indexed:
// 0 Name, 1 TotalProjects, 2 Active, 3 Submitted, 4 Won, 5 Lost,
// 6 TotalQuotedValue, 7 WonValue, 8 WinRate, 9 HitRate, 10 SalesFunnel, 11 BusinessObtaining
// NOTE: Google's gviz API already strips the text header row on its own —
// so we only need to drop the TOTAL row at the end, not slice(1) off the front too.
const qsRows = qs.slice(0, qs.length - 1).filter(r => txt(r[0]));
const qsNames = qsRows.map(r => txt(r[0]));
const qsQuoted = qsRows.map(r => num(r[6]) / 1_000_000);
const qsWon = qsRows.map(r => num(r[7]) / 1_000_000);
const qsWinRate = qsRows.map(r => pct(r[8]));
const qsHitRate = qsRows.map(r => pct(r[9]));
const totalRow = qs[qs.length - 1]; // same column layout as above

// ---- Pipeline: 0 Status, 1 Count, 2 Won Value ----
// Header row is already stripped by gviz, so no leading slice(1) here either.
const pipeRows = pipeline.filter(r => txt(r[0]));
const pipeLabels = pipeRows.map(r => txt(r[0]));
const pipeCounts = pipeRows.map(r => num(r[1]));
const pipeValues = pipeRows.map(r => num(r[2]) / 1_000_000);

// ---- Divisions: 0 Division, 1 Target, 2 Achieved, 3 Balance(text) ----
const divRows = divisions.slice(0, divisions.length - 1).filter(r => txt(r[0]));
const divNames = divRows.map(r => txt(r[0]));
const divTarget = divRows.map(r => num(r[1]));
const divAchieved = divRows.map(r => num(r[2]));

// ---- Executive summary: Google's API detects 2 header rows here (since the
// first two sheet rows are text-only), so both get stripped automatically —
// meaning the revenue/GP numbers are just the numeric rows in what's left,
// with no header row of our own to skip. "Coverage"/"margin" rows are found
// by their own label text, which IS still present in the returned rows.
const findRow = (matchText) => executive.find(r => r.some(cell => txt(cell).toLowerCase().includes(matchText))) || null;
const numericRows = executive.filter(r => isNum(r[0]));
const revenue = numericRows[0] || [{},{},{},{}];
const gp = numericRows[1] || [{},{},{},{}];
const pipeCovRow = findRow('coverage') || [{},{},{},{}];
const marginRow = findRow('margin') || [{},{},{},{}];

lastData = { qsNames, qsQuoted, qsWon, qsWinRate, qsHitRate, totalRow,
pipeLabels, pipeCounts, pipeValues, divNames, divTarget, divAchieved,
revenue, gp, pipeCov: pipeCovRow, margin: marginRow };

renderStatCards(lastData);
renderCharts(lastData);
status.textContent = 'synced ' + new Date().toLocaleTimeString();
firstLoad = false;
} catch (err) {
status.textContent = 'error — check sheet is shared as "anyone with the link"';
console.error(err);
} finally {
btn.disabled = false;
}
}

function renderStatCards(d){
const revTarget = num(d.revenue[0]), revWon = num(d.revenue[1]), revPct = pct(d.revenue[3]);
const gpTarget = num(d.gp[0]), gpWon = num(d.gp[1]), gpPct = pct(d.gp[3]);
const totalWon = num(d.totalRow[4]), totalLost = num(d.totalRow[5]);
const totalQuotedMn = num(d.totalRow[6]) / 1_000_000;
const totalWonValueMn = num(d.totalRow[7]) / 1_000_000;
const overallWinRateDisplay = fmt(d.totalRow[8]) || '—';
const overallWinRateFrac = pct(d.totalRow[8]) / 100;
const rawMultiple = revTarget > 0 ? (totalQuotedMn / revTarget) : 0;

const openStatuses = ['Submitted', 'Under Review', 'Quoting', 'On Hold'];
const openValueMn = d.pipeLabels.reduce((sum, label, i) =>
openStatuses.includes(label) ? sum + d.pipeValues[i] : sum, 0);
const expectedTotalMn = totalWonValueMn + (openValueMn * overallWinRateFrac);
const weightedPct = revTarget > 0 ? (expectedTotalMn / revTarget) * 100 : 0;

const cards = [
{ label:'Revenue: Target vs Won', value:`${revWon.toFixed(1)} / ${revTarget.toFixed(0)} Mn`, footer:`${revPct.toFixed(1)}% of target` },
{ label:'Gross Profit: Target vs Won', value:`${gpWon.toFixed(1)} / ${gpTarget.toFixed(0)} Mn`, footer:`${gpPct.toFixed(1)}% of target` },
{ label:'Weighted Pipeline (Win-Rate Adj.)', value:`${weightedPct.toFixed(0)}%`, footer:`raw pipeline is ${rawMultiple.toFixed(1)}× target (unweighted)` },
{ label:'Overall Win Rate', value: overallWinRateDisplay, footer:`${totalWon} won · ${totalLost} lost` },
];

const grid = document.getElementById('statCards');
const isFirst = firstLoad || grid.children.length === 0;
grid.innerHTML = cards.map((c,i) => `
<div class="plate${isFirst ? ' enter' : ' flash'}" style="animation-delay:${isFirst ? (i*0.07)+'s' : '0s'}">
<div class="label">${c.label}</div>
<div class="value">${c.value}</div>
<div class="footer">${c.footer}</div>
</div>`).join('');
}

function upsertChart(id, config){
if (charts[id]) charts[id].destroy();
charts[id] = new Chart(document.getElementById(id), config);
}

function renderCharts(d){
Chart.defaults.color = '#7e97ab';
Chart.defaults.borderColor = 'rgba(255,255,255,.06)';
Chart.defaults.font.family = "'Inter', sans-serif";
const animDuration = REDUCED_MOTION ? 0 : 900;

upsertChart('valueChart', {
type:'bar',
data:{ labels:d.qsNames, datasets:[
{ label:'Quoted (Mn)', data:d.qsQuoted, backgroundColor:'#4fc6de', borderRadius:3 },
{ label:'Won (Mn)', data:d.qsWon, backgroundColor:'#ff7a45', borderRadius:3 },
]},
options:{ responsive:true, animation:{ duration:animDuration, easing:'easeOutQuart' }, scales:{ y:{ beginAtZero:true } } }
});

upsertChart('rateChart', {
type:'bar',
data:{ labels:d.qsNames, datasets:[
{ label:'Win Rate %', data:d.qsWinRate, backgroundColor:'#ffc857', borderRadius:3 },
{ label:'Hit Rate %', data:d.qsHitRate, backgroundColor:'#4fc6de', borderRadius:3 },
]},
options:{ responsive:true, animation:{ duration:animDuration, easing:'easeOutQuart' }, scales:{ y:{ beginAtZero:true, max:100 } } }
});

upsertChart('pipelineChart', {
type:'doughnut',
data:{ labels:d.pipeLabels, datasets:[{ data:d.pipeCounts,
backgroundColor:['#4fc6de','#ffc857','#3ddc84','#ff5470','#7e97ab','#ff7a45','#8a7bf7'],
borderColor:'#0f2436', borderWidth:2 }]},
options:{ responsive:true, animation:{ duration:animDuration, easing:'easeOutQuart' } }
});

upsertChart('divisionChart', {
type:'bar',
data:{ labels:d.divNames, datasets:[
{ label:'Target (Mn)', data:d.divTarget, backgroundColor:'#28425a', borderRadius:3 },
{ label:'Achieved (Mn)', data:d.divAchieved, backgroundColor:'#ff7a45', borderRadius:3 },
]},
options:{ responsive:true, animation:{ duration:animDuration, easing:'easeOutQuart' }, indexAxis:'y', scales:{ x:{ beginAtZero:true } } }
});
}

function escapeHtml(s){
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function inlineFormat(s){
return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function formatInsight(raw){
const labelColors = { wins:'var(--good)', risks:'var(--bad)', recommendations:'var(--cyan)' };
const blocks = raw.trim().split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
return blocks.map(block => {
const headerMatch = block.match(/^\*\*(.+?)\*\*\s*:?\s*\n?([\s\S]*)$/);
const label = headerMatch ? headerMatch[1].trim() : null;
const body = (headerMatch ? headerMatch[2] : block).trim();
const lines = body.split('\n').map(l => l.trim()).filter(Boolean);
const isList = lines.length > 0 && lines.every(l => /^\d+[\.\)]\s/.test(l));
const bodyHtml = isList
? '<ol>' + lines.map(l => '<li>' + inlineFormat(l.replace(/^\d+[\.\)]\s*/, '')) + '</li>').join('') + '</ol>'
: '<p>' + inlineFormat(body).replace(/\n/g, '<br>') + '</p>';
const color = label ? (labelColors[label.toLowerCase()] || 'var(--cyan)') : null;
return `<div class="insight-block">${label ? `<div class="insight-label" style="color:${color}">${escapeHtml(label)}</div>` : ''}${bodyHtml}</div>`;
}).join('');
}
function revealInsight(el, html){
el.innerHTML = html;
const blocks = el.querySelectorAll('.insight-block');
blocks.forEach((b, i) => {
b.style.animationDelay = REDUCED_MOTION ? '0s' : (i * 0.12) + 's';
requestAnimationFrame(() => b.classList.add('reveal'));
});
}

async function getAIInsights(){
const btn = document.getElementById('aiBtn');
const out = document.getElementById('insightsText');
if (!lastData) { out.textContent = 'Load the dashboard data first.'; return; }
btn.disabled = true;
out.style.color = 'var(--muted)';
out.textContent = 'Thinking…';
try {
const res = await fetch('/.netlify/functions/ai-insights', {
method:'POST',
headers:{ 'Content-Type':'application/json' },
body: JSON.stringify({ summary: lastData })
});
const json = await res.json();
if (!res.ok) throw new Error(json.error?.message || json.error || 'Request failed');
out.style.color = '';
revealInsight(out, formatInsight(json.insight));
} catch (err) {
out.style.color = 'var(--bad)';
out.textContent = 'Could not generate insights: ' + err.message + ' (check the GROQ_API_KEY environment variable is set in Netlify).';
} finally {
btn.disabled = false;
}
}

loadAll();
setInterval(loadAll, REFRESH_MS);
</script>
